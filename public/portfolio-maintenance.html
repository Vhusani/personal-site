<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>TheSouthMart — We'll be back</title>
  <style>
    /* Standalone page: the original relied on css/bootstrap.min.css and
       css/main.css from the old site, which no longer exist in this build. */
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f6f7fb;
      color: #222;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }
    a { color: #2b6cb0; text-decoration: none; }
    a:hover { text-decoration: underline; }
    h1 { color: #111827; font-size: 32px; margin: 0 0 10px; }
    h5 { color: #111827; font-size: 16px; margin: 0 0 10px; }
    .maintenance-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card-maintenance { max-width: 820px; width: 100%; background: #fff; border-radius: 10px; box-shadow: 0 8px 30px rgba(21,31,56,0.08); padding: 40px; }
    .logo { font-weight: 700; font-size: 28px; letter-spacing: 1px; }
    .hero { margin-top: 10px; margin-bottom: 20px; text-align: center; }
    .lead { font-size: 18px; color: #4b5563; }
    .muted { color: #6b7280; }
    .row { display: flex; flex-wrap: wrap; margin: 24px -15px 0; }
    .col-main, .col-side { padding: 0 15px; width: 100%; }
    .btn-primary {
      display: inline-block; padding: 10px 18px; border-radius: 6px;
      background: #2b6cb0; border: 1px solid #2b6cb0; color: #fff;
    }
    .btn-primary:hover { text-decoration: none; background: #245a94; }
    /* Kept from the original: the return link is deliberately hidden. */
    .return-portfolio { display: none !important; }
    @media (min-width: 768px) {
      .col-main { width: 66.666667%; }
      .col-side { width: 33.333333%; text-align: right; }
    }
    @media (max-width: 767px) {
      .col-side { text-align: center; margin-top: 16px; }
    }
    @media (max-width: 576px) {
      .card-maintenance { padding: 24px; }
      h1 { font-size: 26px; }
    }
  </style>
</head>
<body>
  <div class="maintenance-wrap">
    <div class="card-maintenance">
      <div class="logo">
        <img
          src="https://res.cloudinary.com/dbd66gnzy/image/upload/v1758749618/thesologo_mlomkz.svg"
          alt="TheSouthMart"
          style="height:44px; max-width:100%;"
        />
      </div>

      <div class="hero">
        <h1>We'll be back soon</h1>
        <p class="lead">We're making some improvements. We'll be back!</p>
      </div>

      <div class="row">
        <div class="col-main">
          <h5>What you can do</h5>
          <ul class="muted">
            <li>Check back in a few minutes.</li>
            <li>Contact support at <a href="mailto:contact@thesouthmart.example">support@thesouthmart.co.za</a>.</li>
            <li>Follow our Twitter for updates: <a href="#">@Thesouthmart</a></li>
          </ul>
        </div>
        <div class="col-side">
          <a href="index.html" class="btn-primary return-portfolio">Return to Portfolio</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
