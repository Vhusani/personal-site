<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TheSouthMart — We'll be back</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/main.css">
  <style>
    body { background: #f6f7fb; color: #222; }
    .maintenance-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card-maintenance { max-width: 820px; width: 100%; background: #fff; border-radius: 10px; box-shadow: 0 8px 30px rgba(21,31,56,0.08); padding: 40px; }
    .logo { font-weight:700; font-size:28px; letter-spacing:1px; }
    .hero { margin-top: 10px; margin-bottom: 20px; }
    .lead { font-size:18px; color:#4b5563; }
    .muted { color:#6b7280; }
    .btn-primary { background:#2b6cb0; border-color:#2b6cb0; }
    .return-portfolio { display: none !important; }
    @media (max-width:576px){ .card-maintenance { padding: 24px; } }
  </style>
</head>
<body>
  <div class="maintenance-wrap">
    <div class="card-maintenance">
      <div class="d-flex align-items-center justify-content-between">
        <div class="logo"><img src="https://res.cloudinary.com/dbd66gnzy/image/upload/v1758749618/thesologo_mlomkz.svg" alt="TheSouthMart" style="height:44px; max-width:100%;"></div>
      </div>

      <div class="hero text-center mt-4">
        <h1>We'll be back soon</h1>
        <p class="lead">We're making some improvements. We'll be back!</p>
      </div>

      <div class="row mt-4">
        <div class="col-md-8">
          <h5>What you can do</h5>
          <ul class="muted">
            <li>Check back in a few minutes.</li>
            <li>Contact support at <a href="mailto:contact@thesouthmart.example">support@thesouthmart.co.za</a>.</li>
            <li>Follow our Twitter for updates: <a href="#">@Thesouthmart</a></li>
          </ul>
        </div>
        <div class="col-md-4 text-md-right text-center mt-3 mt-md-0">
          <a href="index.html" class="btn btn-primary return-portfolio">Return to Portfolio</a>
        </div>
      </div>

  </div>
</body>
</html>
